<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OverlayHub</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --row-hover: #f6f8fa;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #30363d;
        --row-hover: #161b22;
        --accent: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    header p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    #repo {
      font-weight: 600;
      color: var(--accent);
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 6px;
    }
    li a.tool {
      display: block;
      padding: 10px 10px;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    li a.tool:hover,
    li a.tool:focus {
      background: var(--row-hover);
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .tool-name { font-size: 13px; font-weight: 600; }
    .tool-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tool-url {
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #empty {
      padding: 20px 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>OverlayHub</h1>
    <p id="subtitle">Overlay tools for this repo</p>
  </header>

  <main>
    <p id="empty" hidden>Open a GitHub repository page to see overlay tools.</p>
    <ul id="tool-list" aria-label="Overlay tools"></ul>
  </main>

  <script src="tools.js"></script>
  <script src="popup.js"></script>
</body>
</html>
